mixed-port: 7890
mode: rule
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver-policy:
    '+.cn': 223.5.5.5
sniffer:
  enable: true
proxy-providers:
  prov-a:
    type: http
    url: http://127.0.0.1:9/prov.yaml
    interval: 3600
proxies:
  - { name: HK-01, type: ss, server: 127.0.0.1, port: 9, cipher: aes-128-gcm, password: x }
proxy-groups:
  - name: Proxy
    type: select
    proxies: [HK-01]
  - name: Auto
    type: url-test
    use: [prov-a]
    url: http://www.gstatic.com/generate_204
    interval: 300
rules:
  - DOMAIN-SUFFIX,github.com,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
tun:
  enable: true
