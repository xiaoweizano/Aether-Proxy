<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — 静默</title>
<style>
  :root {
    --bg: #0B0C0E;
    --side: #0B0C0E;
    --line: #1F2226;
    --line-2: #2A2E34;
    --text: #E9E9E7;
    --dim: #8F959C;
    --faint: #666D75;
    --accent: #5B8DEF;
    --ok: #4ADE80;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --num: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
  ::selection { background: rgba(91,141,239,.25); color: #fff; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

  .titlebar { display: flex; align-items: center; padding-left: 20px; border-bottom: 1px solid var(--line); user-select: none; }
  .titlebar .name { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .titlebar .spacer { flex: 1; }
  .winbtns { display: flex; height: 100%; }
  .winbtns span { width: 46px; display: grid; place-items: center; color: var(--faint); font-size: 11px; }
  .winbtns span:hover { background: #16181B; color: var(--text); }
  .winbtns .close:hover { background: #B3301F; color: #fff; }

  .shell { display: grid; grid-template-columns: 208px 1fr; min-height: 0; }
  .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 0 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 22px 26px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 12px; color: var(--dim); }
  .brand .word { font-size: 15px; font-weight: 550; letter-spacing: -.01em; }

  nav { display: flex; flex-direction: column; }
  .navitem { position: relative; display: flex; align-items: center; height: 38px; padding: 0 22px; color: var(--dim); text-decoration: none; font-size: 13px; }
  .navitem:hover { color: var(--text); }
  .navitem.active { color: var(--text); }
  .navitem.active::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); }
  .side .grow { flex: 1; }
  .side .meta { padding: 14px 22px 0; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; display: flex; align-items: center; gap: 7px; }
  .side .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }

  .main { padding: 34px 44px 26px; overflow-y: auto; min-height: 0; }

  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 30px; }
  .head h1 { margin: 0; font-size: 28px; font-weight: 550; letter-spacing: -.025em; }
  .head .st { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; }
  .head .st .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .head .right { margin-left: auto; display: flex; align-items: center; gap: 20px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .head .right b { color: var(--dim); font-weight: 500; }
  .seg { display: inline-flex; gap: 18px; }
  .seg button {
    font: inherit; font-size: 12px; padding: 0 0 4px;
    background: none; border: 0; border-bottom: 1px solid transparent;
    color: var(--faint); cursor: default;
  }
  .seg button.on { color: var(--text); border-bottom-color: var(--accent); }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
  .hero .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
  .hero .node { font-size: 38px; font-weight: 550; letter-spacing: -.03em; line-height: 1; }
  .hero .sub { margin-top: 10px; color: var(--faint); font-size: 12px; }
  .hero .sub em { font-style: normal; color: var(--dim); }
  .hero .right { text-align: right; }
  .hero .pct { font-size: 26px; font-weight: 550; font-variant-numeric: tabular-nums; }
  .hero .pct small { font-size: 12px; color: var(--faint); margin-left: 6px; font-weight: 400; }
  .hero .note { margin-top: 8px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

  .ticks { display: flex; gap: 3px; height: 12px; margin-top: 22px; }
  .ticks i { flex: 1; background: var(--line-2); border-radius: 1px; }
  .ticks i.on { background: var(--accent); opacity: .8; }
  .ticks i.miss { background: #6B3A36; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 22px 0; border-bottom: 1px solid var(--line); }
  .stat { padding: 0 26px; border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; }
  .stat .v { font-size: 21px; font-weight: 550; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat .v small { font-size: 11px; color: var(--faint); font-weight: 400; margin-left: 4px; }

  .chart { padding-top: 22px; }
  .chart .ph { display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
  .chart .ph .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .chart .ph .lg { margin-left: auto; display: flex; gap: 18px; font-size: 11px; color: var(--faint); }
  .chart .ph .lg span { display: flex; align-items: center; gap: 6px; }
  .chart .ph .lg i { width: 12px; height: 1px; display: inline-block; }
  .chart .ph .lg .d i { background: var(--accent); }
  .chart .ph .lg .u i { background: var(--dim); }
  .chart svg { display: block; width: 100%; height: 150px; }

  .foot { display: flex; gap: 28px; padding-top: 16px; margin-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .foot b { color: var(--dim); font-weight: 500; }
</style>
</head>
<body>
<div class="titlebar"><div class="name">Aether</div><div class="spacer"></div><div class="winbtns"><span>—</span><span>▢</span><span class="close">✕</span></div></div>

<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">A</div><div class="word">Aether</div></div>
    <nav>
      <a class="navitem active" href="#">仪表盘</a>
      <a class="navitem" href="#">节点</a>
      <a class="navitem" href="#">连接</a>
    </nav>
    <div class="grow"></div>
    <nav>
      <a class="navitem" href="#">设置</a>
      <a class="navitem" href="#">日志</a>
    </nav>
    <div class="meta"><span class="dot"></span>Version 0.1.0</div>
  </aside>

  <main class="main">
    <div class="head">
      <h1>仪表盘</h1>
      <div class="st"><span class="dot"></span>已连接</div>
      <div class="right">
        <span class="seg" role="group" aria-label="代理模式"><button class="on">规则</button><button>全局</button><button>直连</button></span>
        系统代理 <b>开</b>
      </div>
    </div>

    <section class="hero">
      <div>
        <div class="label">当前节点</div>
        <div class="node">HK-01</div>
        <div class="sub">Proxy ▸ 规则模式 · <em>TCP</em> · 443</div>
        <div class="ticks">
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="miss"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
        </div>
      </div>
      <div class="right">
        <div class="pct">100%<small>最近 60 分钟</small></div>
        <div class="note">0 次失败 · 最近 38ms</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><div class="k">会话时长</div><div class="v">01:10:54</div></div>
      <div class="stat"><div class="k">已用流量</div><div class="v">2.7<small>MB</small></div></div>
      <div class="stat"><div class="k">下载</div><div class="v">0.00<small>MB/s</small></div></div>
      <div class="stat"><div class="k">上传</div><div class="v">0.00<small>MB/s</small></div></div>
    </section>

    <section class="chart">
      <div class="ph">
        <span class="t">流量历史 · 60 分钟</span>
        <span class="lg"><span class="d"><i></i>下载</span><span class="u"><i></i>上传</span></span>
      </div>
      <svg viewBox="0 0 800 150" preserveAspectRatio="none" aria-label="最近 60 分钟流量">
        <path d="M0,142 L50,140 L100,143 L150,136 L200,140 L250,132 L300,138 L350,126 L380,26 L410,78 L440,48 L470,128 L500,44 L530,130 L560,38 L590,132 L620,128 L650,34 L680,134 L710,138 L740,140 L770,140 L800,142" fill="none" stroke="#5B8DEF" stroke-width="1.4"/>
        <path d="M0,146 L80,145 L160,146 L240,144 L320,140 L400,138 L480,143 L560,140 L640,144 L720,145 L800,146" fill="none" stroke="#8F959C" stroke-width="1.2" stroke-opacity=".7"/>
      </svg>
    </section>

    <div class="foot">
      <span>内核 <b>mihomo v1.19.32</b></span>
      <span>端口 <b>5566</b></span>
      <span>策略组 <b>3</b></span>
      <span>内存 <b>68 MB</b></span>
      <span>启动于 <b>13:31:13</b></span>
    </div>
  </main>
</div>
</body>
</html>
